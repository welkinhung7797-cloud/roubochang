<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Penguin Can Fight</title>
<style>
:root{
  --bg:#0c0a07; --panel:#1c1610; --panel2:#271e14; --line:#4a3826;
  --ink:#0d0a08; --text:#efe6d4; --muted:#a3927a;
  --accent:#e0913c; --good:#8fc47f; --bad:#d9564f; --gold:#e0c341;
  --font:"Noto Sans TC","Microsoft JhengHei","PingFang TC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);overflow:hidden;font-family:var(--font);color:var(--text)}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1280px;height:720px;transform-origin:center center;flex:none}
#game{position:absolute;inset:0;width:1280px;height:720px;background:#12141a;display:block}

.hidden{display:none !important}
button{font-family:var(--font);cursor:pointer;border:none;color:inherit}
button:disabled{cursor:not-allowed;opacity:.45}

/* ---- 覆蓋面板共用 ---- */
.overlay{position:absolute;inset:0;background:rgba(11,8,5,.92);display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:26px}
.title-xl{font-size:62px;font-weight:900;letter-spacing:.22em;text-indent:.22em;line-height:1}
.title-md{font-size:26px;font-weight:800;letter-spacing:.16em;text-indent:.16em}
.sub{color:var(--muted);font-size:14px;letter-spacing:.08em;margin-top:12px;line-height:1.9}
.rule{width:120px;height:3px;background:var(--accent);margin:20px 0}

.btn{background:var(--panel2);border:2px solid var(--line);color:var(--text);
  padding:13px 34px;font-size:16px;font-weight:700;letter-spacing:.12em;transition:.12s}
.btn:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#181008}
.btn.primary:hover:not(:disabled){background:#e8994a;border-color:#e8994a;color:#181008}
.btn.ghost{background:transparent}

/* ---- 主選單：雪夜道場 ---- */
#panel-menu{background:#0c0a07 url('assets/ui/menu_bg.jpg') center/cover no-repeat;
  justify-content:flex-start;padding-top:52px}
#panel-menu .logo{position:relative;text-align:center}
#panel-menu .logo .cn{font-size:88px;font-weight:900;letter-spacing:.3em;text-indent:.3em}
#panel-menu .logo .cn.en{font-size:58px;letter-spacing:.08em;text-indent:.08em;line-height:1.12;
  color:#fff;text-shadow:0 4px 0 #1a1008,4px 0 0 #1a1008,-4px 0 0 #1a1008,0 -4px 0 #1a1008,
  3px 3px 0 #1a1008,-3px 3px 0 #1a1008,3px -3px 0 #1a1008,-3px -3px 0 #1a1008}
#panel-menu .logo .bar{height:5px;background:var(--accent);margin:12px auto 0;width:320px;
  box-shadow:0 3px 0 rgba(10,6,3,.6)}
#panel-menu .rule{display:none}
#panel-menu .tagline{margin-top:16px;color:#f5ead2;font-size:15px;letter-spacing:.2em;
  background:rgba(16,10,5,.6);border:1px solid rgba(224,145,60,.45);padding:7px 20px}
#panel-menu #btn-play{margin-top:26px;font-size:18px;padding:14px 60px}
#panel-menu .keys{position:absolute;left:18px;bottom:14px;margin:0;color:#d8cdb8;font-size:12px;
  letter-spacing:.08em;line-height:1.95;text-align:left;background:rgba(14,9,5,.66);padding:8px 16px}

/* ---- 角色選擇 ---- */
#panel-select{justify-content:flex-start;padding:18px 26px}
.select-head{display:flex;align-items:baseline;gap:18px;width:100%;max-width:1180px;margin-bottom:10px}
.select-head h2{font-size:22px;font-weight:800;letter-spacing:.18em}
.select-head .hint{color:var(--muted);font-size:12.5px;letter-spacing:.06em}
#char-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px;width:100%;max-width:1200px;
  overflow-y:auto;max-height:548px;padding-right:4px}
#char-grid::-webkit-scrollbar{width:8px}
#char-grid::-webkit-scrollbar-thumb{background:#4a3826}
.char-card{background:var(--panel);border:2px solid var(--line);padding:6px;cursor:pointer;transition:.12s;
  display:flex;flex-direction:column;align-items:center;text-align:center}
.char-card:hover{border-color:#6b5636}
.char-card.active{border-color:var(--accent);background:#2a2116}
.char-card .portrait{height:56px;width:auto;max-width:72px;object-fit:contain;image-rendering:auto}
.char-card.locked{opacity:.55;cursor:not-allowed}
.char-card .portrait.dim{filter:grayscale(1) brightness(.6)}
.char-lock{font-size:10.5px;color:#a3927a;line-height:1.6;margin-top:4px;text-align:center}
.char-name{font-size:14px;font-weight:800;letter-spacing:.04em;line-height:1.25}
.char-tag{font-size:9.5px;color:var(--accent);letter-spacing:.02em;margin-bottom:3px;text-align:center;line-height:1.2}
.char-tag i{font-style:normal;color:#9c8b72}
.char-stats{display:flex;flex-wrap:wrap;gap:2px;justify-content:center;margin-bottom:4px}
.char-stats span{font-size:9.5px;padding:0 3px;border:1px solid;line-height:1.45}
.char-stats .up{color:var(--good);border-color:#2f4a35}
.char-stats .down{color:var(--bad);border-color:#4a2f2f}
.char-desc{font-size:10px;color:var(--muted);line-height:1.45;text-align:left;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.char-best{font-size:10px;color:var(--gold);margin-top:4px}

.select-foot{display:flex;align-items:center;gap:16px;width:100%;max-width:1200px;margin:0 0 10px}
.select-foot #btn-start{margin-left:auto}
#danger-row{display:flex;gap:6px}
.danger-btn{width:40px;height:40px;background:var(--panel);border:2px solid var(--line);
  font-size:17px;font-weight:800;color:var(--text)}
.danger-btn.active{border-color:var(--bad);color:var(--bad);background:#2a1712}
.danger-btn.locked{opacity:.3;cursor:not-allowed}
#danger-note{font-size:11.5px;color:var(--muted)}
.foot-label{font-size:12px;color:var(--muted);letter-spacing:.14em}

/* ---- 升級 ---- */
#panel-levelup{background:rgba(11,8,5,.94)}
#levelup-title{font-size:30px;font-weight:900;letter-spacing:.18em}
#levelup-cards{display:flex;gap:14px;margin-top:26px}
.lv-card{width:214px;background:var(--panel);border:2px solid var(--line);padding:20px 16px;
  text-align:left;transition:.12s}
.lv-card:hover{background:#2a2116;transform:translateY(-3px)}
.lv-stat{font-size:15px;font-weight:800;letter-spacing:.1em}
.lv-icon{height:52px;width:auto;max-width:70px;object-fit:contain;display:block;margin:0 auto 8px}
.chip-icon{height:30px;width:auto;max-width:34px;object-fit:contain}
.lv-val{font-size:34px;font-weight:900;margin:6px 0 10px}
.lv-desc{font-size:11.5px;color:var(--muted);line-height:1.7;min-height:38px}
.lv-cur{font-size:11px;color:#8a795e;margin-top:8px;border-top:1px solid var(--line);padding-top:7px}

/* ---- 商店 ---- */
#panel-shop{justify-content:flex-start;padding:14px 22px;background:#0f0b07}
.shop-head{display:flex;align-items:center;gap:16px;width:100%;max-width:1200px;margin-bottom:10px}
.shop-head h2{font-size:20px;font-weight:800;letter-spacing:.16em}
.shop-head .mat{font-size:18px;font-weight:800;color:var(--good);margin-left:auto}
.shop-head .mat b{font-size:24px}
#shop-items{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:1200px}
.shop-card{background:var(--panel);border:2px solid var(--line);padding:11px;display:flex;flex-direction:column}
.shop-card.sold{opacity:.4}
.shop-top{display:flex;align-items:center;gap:9px}
.shop-icon{width:56px;height:56px;flex:none}
.shop-name .tier{font-size:11px;font-weight:700;letter-spacing:.1em}
.shop-name .nm{font-size:19px;font-weight:800;letter-spacing:.06em}
.merge-flag{margin-top:6px;font-size:11.5px;color:var(--gold);border:1px solid #4a3f1e;
  background:#221d10;padding:3px 7px;letter-spacing:.05em}
.shop-info{margin:8px 0;flex:1}
.kv{display:flex;justify-content:space-between;font-size:12.5px;padding:2.5px 0;
  border-bottom:1px solid #2c2318;color:var(--muted)}
.kv b{color:var(--text);font-weight:700}
.kv b.up{color:var(--good)} .kv b.down{color:var(--bad)}
.tagrow{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tagrow i{font-style:normal;font-size:10.5px;color:var(--accent);border:1px solid #4a3a22;padding:1px 5px}
.flavor{font-size:11px;color:#8f7f68;line-height:1.6;margin-top:7px}
.shop-bottom{display:flex;gap:6px}
.buy-btn{flex:1;background:var(--accent);color:#181008;font-weight:800;font-size:13.5px;padding:8px}
.buy-btn:disabled{background:#33291c;color:#8a795e}
.lock-btn{background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-size:12px;padding:8px 10px}
.lock-btn.on{background:#3a2f18;border-color:var(--gold);color:var(--gold)}

.shop-lower{display:flex;gap:12px;width:100%;max-width:1200px;margin-top:11px;flex:1;min-height:0}
#loadout{flex:1;background:var(--panel);border:2px solid var(--line);padding:10px;overflow-y:auto}
#stats-panel{width:330px;background:var(--panel);border:2px solid var(--line);padding:10px}
.sec-title{font-size:12px;font-weight:800;letter-spacing:.16em;color:var(--muted);
  border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:8px}
.loadout-row{display:flex;flex-wrap:wrap;gap:7px}
.slot{width:78px;border:2px solid var(--line);background:var(--panel2);padding:4px 4px 0;
  text-align:center;position:relative;overflow:hidden}
.slot canvas{width:52px;height:52px;display:block;margin:0 auto}
.slot-name{font-size:11.5px;font-weight:700;line-height:1.3}
.slot-tier{font-size:10px;line-height:1.3;margin-bottom:3px}
.sell-btn{display:block;width:calc(100% + 8px);margin:0 -4px;background:#3a2226;border:none;
  border-top:1px solid #5c3239;color:#e08a8a;font-size:10px;padding:2px 0}
.sell-btn:hover{background:#5c3239;color:#fff}
.tech-slot{padding-bottom:4px}
.tech-glyph{font-size:30px;font-weight:900;line-height:48px;height:48px}
.tech-glyph.empty{color:#4a4030}
.combo-row{align-items:center}
.combo-arrow{font-size:20px;font-weight:900;color:#8a795e;padding:0 2px}
.tech-slot.clickable{cursor:pointer}
.tech-slot.clickable:hover{background:#2c2418}
.char-combo{display:flex;align-items:center;gap:2px;font-size:14px;font-weight:900;margin-bottom:3px;line-height:1.2}
.char-combo i{font-style:normal;color:#6b5c46;font-size:11px}
#char-detail{position:absolute;left:50%;transform:translateX(-50%);bottom:14px;
  width:calc(100% - 52px);max-width:1200px;background:#1a140d;
  border:2px solid var(--accent);padding:6px 14px;font-size:12.5px;line-height:1.6;z-index:5;
  pointer-events:none;max-height:96px;overflow:hidden}
#char-detail b{font-size:15px;letter-spacing:.08em}
#char-detail .d-combo{color:var(--accent)}
#char-detail .d-weapon{color:#9aa4b2}
#char-detail .d-desc{color:var(--muted);font-size:12.5px}
.item-row{display:flex;flex-wrap:wrap;gap:5px}
.item-chip{display:flex;align-items:center;gap:4px;border:1px solid var(--line);
  background:var(--panel2);padding:2px 7px 2px 2px}
.item-chip canvas{width:34px;height:34px}
.item-chip span{font-size:11.5px}
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px}
.stat-cell{display:flex;justify-content:space-between;font-size:12.5px;padding:2.5px 0;
  border-bottom:1px solid #2c2318}
.stat-cell.zero{opacity:.35}
.stat-cell .sn{color:var(--muted)}
.shop-foot{display:flex;gap:10px;align-items:center;width:100%;max-width:1200px;margin-top:10px}
.shop-foot .keyhint{font-size:11px;color:#8a795e;margin-left:auto;letter-spacing:.06em}

/* ---- 結算 ---- */
#end-title{font-size:70px;font-weight:900;letter-spacing:.24em;text-indent:.24em}
#end-sub{color:var(--muted);font-size:14.5px;margin-top:8px;letter-spacing:.06em}
#end-stats{margin-top:22px;width:330px}
#end-unlock{margin-top:16px;color:var(--gold);font-size:14px;letter-spacing:.1em;
  border:1px solid #4a3f1e;background:#221d10;padding:7px 18px}
.end-btns{display:flex;gap:12px;margin-top:26px}

/* ---- 提示 ---- */
/* ---- F2 調參面板 ---- */
#tune-panel{position:absolute;right:8px;top:8px;bottom:8px;width:300px;background:#1a140d;
  border:2px solid var(--accent);z-index:50;display:flex;flex-direction:column;font-size:12px}
.tune-head{display:flex;align-items:center;gap:6px;padding:8px 10px;border-bottom:1px solid var(--line)}
.tune-head b{font-size:14px;letter-spacing:.1em}
.tune-head span{color:var(--muted);font-size:10px;flex:1}
.tune-head button{background:var(--panel2);border:1px solid var(--line);color:var(--text);
  font-size:11px;padding:3px 8px}
.tune-head button:hover{border-color:var(--accent)}
#tune-body{flex:1;overflow-y:auto;padding:6px 10px}
#tune-body::-webkit-scrollbar{width:8px}
#tune-body::-webkit-scrollbar-thumb{background:#4a3826}
.tune-group{font-size:11px;font-weight:800;letter-spacing:.14em;color:var(--accent);
  margin:10px 0 4px;border-bottom:1px solid var(--line);padding-bottom:3px}
.tune-row{display:flex;align-items:center;gap:8px;padding:3px 0}
.tune-row label{flex:1;color:#dfd4bd}
.tune-row input[type=range]{width:90px}
.tune-row input[type=number]{width:62px;background:var(--panel2);border:1px solid var(--line);
  color:var(--text);font-size:12px;padding:2px 4px;text-align:right}
.tune-row.changed label{color:var(--gold)}

.toast{position:absolute;left:50%;top:78px;transform:translateX(-50%) translateY(-14px);
  background:var(--panel2);border:2px solid var(--accent);color:var(--text);
  padding:8px 20px;font-size:14px;font-weight:700;letter-spacing:.06em;opacity:0;
  transition:.16s;pointer-events:none;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{border-color:var(--bad);color:#e89a9a}
#hud-hint{display:none !important}
/* ---- 暫停選單 ---- */
#panel-pause .pause-row{display:flex;align-items:center;gap:14px;margin:6px 0 4px;
  background:var(--panel);border:2px solid var(--line);padding:12px 22px;box-shadow:0 3px 0 rgba(8,5,2,.4)}
#panel-pause .pause-row label{font-size:14px;letter-spacing:.14em;color:var(--muted)}
#panel-pause .pause-row input[type=range]{width:220px}
#panel-pause .pause-row span{font-size:15px;font-weight:800;width:40px;text-align:right}
#panel-pause .pause-btns{display:flex;gap:12px;margin-top:18px}

/* ---- 招式與連段（重設計）---- */
.mv-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:start}
.mv-card{border:2px solid var(--line);background:var(--panel2);position:relative;
  box-shadow:0 3px 0 rgba(8,5,2,.4)}
.mv-card.clickable{cursor:pointer}
.mv-card.clickable:hover{background:#2c2418;border-color:var(--accent)}
.mv-card.open{border-color:var(--accent)}
.mv-trig{display:flex;align-items:center;gap:6px;background:#17110a;
  border-bottom:2px solid var(--line);padding:3px 6px}
.mv-trig span{font-size:11px;color:#c3b295;letter-spacing:.04em}
.mv-trig em{font-style:normal;margin-left:auto;font-size:10px;color:var(--accent);white-space:nowrap}
.mv-trig em.none{color:#7d6c55}
.beat{display:inline-block;width:20px;height:20px;line-height:20px;text-align:center;
  font-size:13px;font-weight:900;color:#17110a;flex:none;font-style:normal}
.beat-still{background:#e8964a}
.beat-move{background:#8fd4e0}
.beat-dash{background:#ffd44a}
.mv-body{display:flex;gap:7px;align-items:center;padding:7px}
.mv-icon{width:46px;height:46px;flex:none}
.mv-name{font-size:15px;font-weight:800;letter-spacing:.04em}
.mv-brief{font-size:11px;color:var(--muted);line-height:1.5;margin-top:2px}
.mv-pick{position:absolute;left:-2px;right:-2px;top:100%;z-index:8;background:#1a140d;
  border:2px solid var(--accent);box-shadow:0 4px 0 rgba(8,5,2,.5)}
.mv-opt{display:block;width:100%;text-align:left;background:none;padding:5px 8px;
  border-bottom:1px solid #2c2318;cursor:pointer}
.mv-opt:hover{background:#2c2418}
.mv-opt.on{background:#332715;border-left:3px solid var(--accent);padding-left:5px}
.mv-opt b{font-size:12.5px;font-weight:800;display:block;color:var(--text)}
.mv-opt span{font-size:10.5px;color:var(--muted);line-height:1.5}
.mv-pick-foot{font-size:10px;color:#8a795e;padding:4px 8px;background:#14100a}

.combo-block{margin-top:9px;border:2px solid var(--line);background:#17110a;padding:7px 9px;
  box-shadow:0 3px 0 rgba(8,5,2,.4)}
.combo-head{font-size:12px;font-weight:800;letter-spacing:.16em;color:#c3b295;
  border-bottom:1px solid var(--line);padding-bottom:5px;margin-bottom:4px}
.combo-head span{font-weight:400;letter-spacing:.02em;font-size:10.5px;color:#8a795e;margin-left:10px}
.cb{padding:6px 0}
.cb+.cb{border-top:1px solid #2c2318}
.cb-top{display:flex;align-items:center;gap:5px}
.cb-nm{font-size:14.5px;font-weight:800;letter-spacing:.04em}
.cb.sig .cb-nm{color:var(--gold)}
.cb-how{font-size:12px;color:#c3b295;line-height:1.65;margin-top:2px}
.bw{display:inline-block;font-style:normal;font-weight:800;color:#17110a;
  padding:0 4px;margin:0 1px;font-size:11.5px}
.bw-still{background:#e8964a}
.bw-move{background:#8fd4e0}
.bw-dash{background:#ffd44a}
.cb-desc{font-size:11px;color:#8a795e;line-height:1.6;margin-top:3px}
.cb-ext{font-size:11px;color:#8fd4e0;line-height:1.6;margin-top:4px;
  border-left:2px solid #2f4d55;padding-left:6px}
.cb-ext-key{color:#6f8a91;margin-right:5px}
.cb-ext b{font-weight:800}
.cb-ext span{display:block;color:#6f8a91}
.combo-line{display:flex;align-items:center;gap:4px;padding:3px 0}
.combo-line+.combo-line{border-top:1px solid #2c2318}
.combo-line .arrow{color:#6b5c46;font-weight:900;padding:0 2px}
.combo-line .act{font-size:11.5px;color:#c3b295;letter-spacing:.04em;min-width:76px}
.combo-line .eq{color:#6b5c46}
.combo-line .nm{font-size:14px;font-weight:800;letter-spacing:.04em}
.combo-line.sig .nm{color:var(--gold)}
.combo-sig-tag{font-size:9.5px;font-weight:800;color:#241405;background:var(--gold);
  padding:1px 5px;margin-left:3px;letter-spacing:.08em}
.combo-ext{font-size:10.5px;color:#8fd4e0;margin-left:auto;letter-spacing:.02em}
.buy-note{font-size:10.5px;color:#8a795e;line-height:1.5;margin-top:5px;
  border-left:2px solid var(--line);padding-left:6px}
#pause-combo-row{margin-top:16px;width:min(760px,88vw);border:2px solid var(--line);
  background:#17110a;text-align:left}
#pause-combo-row summary{cursor:pointer;padding:7px 12px;font-size:13px;font-weight:800;
  letter-spacing:.14em;color:#c3b295;list-style:none}
#pause-combo-row summary::-webkit-details-marker{display:none}
#pause-combo-row summary::before{content:'▸ ';color:var(--accent)}
#pause-combo-row[open] summary::before{content:'▾ '}
#pause-combo{max-height:46vh;overflow-y:auto;padding:0 12px 10px}

/* ---- 像素道場皮膚：硬邊、木質、落影 ---- */
.btn,.danger-btn{box-shadow:0 3px 0 rgba(8,5,2,.55),inset 0 2px 0 rgba(255,255,255,.06)}
.btn:active:not(:disabled),.danger-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(8,5,2,.55)}
.btn.primary{border-color:#8a5622;color:#241405}
.btn.primary:hover:not(:disabled){color:#241405}
.char-card,.lv-card,.shop-card,#loadout,#stats-panel{box-shadow:0 3px 0 rgba(8,5,2,.4)}
.select-head h2,.shop-head h2,#levelup-title{color:#e8cf9f}

#errbox{position:absolute;left:12px;bottom:12px;background:#3a1c1c;border:2px solid #d9564f;
  color:#ffb3b3;font-size:12px;padding:8px 12px;max-width:600px;z-index:99}
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>

  <!-- 主選單 -->
  <div id="panel-menu" class="overlay">
    <div class="logo">
      <div class="cn en">PENGUIN<br>CAN FIGHT</div>
      <div class="bar"></div>
    </div>
    <div class="rule"></div>
    <button id="btn-play" class="btn primary">開始</button>
    <div class="keys">
      WASD 或方向鍵移動　·　武器全自動攻擊　·　Space 衝刺<br>
      原地打中＝站拍、移動打中＝移拍、衝刺打中＝衝拍——湊齊指令按衝刺放奧義<br>
      升級撿格鬥家裝備　·　活過二十波　·　Esc 暫停　·　M 靜音
    </div>
  </div>

  <!-- 角色選擇 -->
  <div id="panel-select" class="overlay hidden">
    <div class="select-head">
      <h2>選擇職業</h2>
      <span class="hint">每個職業都有明確的強項與代價，決定這一局的打法</span>
    </div>
    <div class="select-foot">
      <span class="foot-label">危險等級</span>
      <div id="danger-row"></div>
      <span id="danger-note"></span>
      <button id="btn-start" class="btn primary">先選一個職業</button>
      <button id="btn-back" class="btn ghost">返回</button>
    </div>
    <div id="char-grid"></div>
    <div id="char-detail" class="hidden"></div>
  </div>

  <!-- 升級 -->
  <div id="panel-levelup" class="overlay hidden">
    <div id="levelup-title"></div>
    <div class="sub" style="margin-top:6px">選一項永久強化</div>
    <div id="levelup-cards"></div>
  </div>

  <!-- 商店 -->
  <div id="panel-shop" class="overlay hidden">
    <div class="shop-head">
      <h2 id="shop-wave"></h2>
      <button id="shop-reroll" class="btn" style="padding:8px 18px;font-size:13px">重骰</button>
      <div class="mat"><b id="shop-mat">0</b> 素材</div>
    </div>
    <div id="shop-items"></div>
    <div class="shop-lower">
      <div id="loadout"></div>
      <div id="stats-panel"></div>
    </div>
    <div class="shop-foot">
      <button id="shop-next" class="btn primary"><span id="shop-next-label">進入下一波</span></button>
      <span class="keyhint">R 重骰　·　Enter 進入下一波　·　同名同階武器買下即合成</span>
    </div>
  </div>

  <!-- 結算 -->
  <div id="panel-end" class="overlay hidden">
    <div id="end-title"></div>
    <div id="end-sub"></div>
    <div id="end-stats"></div>
    <div id="end-unlock" class="hidden"></div>
    <div class="end-btns">
      <button id="btn-retry" class="btn primary">再來一局</button>
      <button id="btn-menu" class="btn ghost">回主選單</button>
    </div>
  </div>

  <!-- 暫停選單（Esc） -->
  <div id="panel-pause" class="overlay hidden">
    <div class="title-md">暫停</div>
    <div class="rule"></div>
    <div class="pause-row">
      <label>音效</label>
      <input id="opt-vol" type="range" min="0" max="100" step="5">
      <span id="opt-vol-val">80</span>
    </div>
    <div class="pause-row">
      <label>音樂</label>
      <input id="opt-bgm" type="range" min="0" max="100" step="5">
      <span id="opt-bgm-val">55</span>
    </div>
    <div class="pause-btns">
      <button id="btn-resume" class="btn primary">繼續遊戲</button>
      <button id="btn-quit" class="btn ghost">放棄這一局，回主選單</button>
    </div>
    <!-- 連段表收起來放最後：暫停最常做的事是調音量，不是讀招式表 -->
    <details id="pause-combo-row">
      <summary>看連段表</summary>
      <div id="pause-combo"></div>
    </details>
    <div class="sub">Esc 繼續　·　M 靜音　·　F2 調參面板</div>
  </div>

  <!-- F2 即時調參面板 -->
  <div id="tune-panel" class="hidden">
    <div class="tune-head">
      <b>即時調參</b><span>改了立刻生效，重載也保留</span>
      <button id="tune-reset">全部重置</button>
      <button id="tune-export">匯出</button>
      <button id="tune-close">×</button>
    </div>
    <div id="tune-body"></div>
  </div>

  <div id="toast" class="toast"></div>
  <div id="hud-hint">WASD 移動　·　Space 衝刺／連段　·　Esc 暫停</div>
  <div id="errbox" class="hidden"></div>
</div>

<script src="src/data.js"></script>
<script src="src/engine.js"></script>
<script src="src/audio.js"></script>
<script src="src/render.js"></script>
<script src="src/ui.js"></script>
<script>
/* 固定舞台等比縮放，讓遊戲在任何視窗尺寸都完整可見 */
(function () {
  const stage = document.getElementById('stage');
  function fit() {
    const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    stage.style.transform = 'scale(' + s + ')';
    window.__stageScale = s;
  }
  window.addEventListener('resize', fit);
  fit();
})();
</script>
</body>
</html>
